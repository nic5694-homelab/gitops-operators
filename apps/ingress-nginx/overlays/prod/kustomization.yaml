# apps/ingress-nginx/overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patches:
  - target:
      kind: ServiceAccount
      name: ingress-nginx
      namespace: ingress-nginx
    patch: |-
      - op: add
        path: /metadata/annotations/prod-annotation
        value: "true"
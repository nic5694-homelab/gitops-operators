apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concordia-predictions-backend
  namespace: concordia-predictions
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: api.concordia-predictions.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concordia-predictions-backend
                port:
                  number: 8080


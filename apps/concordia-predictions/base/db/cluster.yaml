apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-17-ha
  namespace: concordia-predictions
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: concordia-predictions
      owner: app
  superuserSecret:
    name: postgresql-superuser-secret
  storage:
    size: 10Gi
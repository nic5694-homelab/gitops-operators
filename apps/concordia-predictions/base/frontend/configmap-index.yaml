apiVersion: v1
kind: ConfigMap
metadata:
  name: concordia-predictions-frontend-index
  namespace: concordia-predictions
  labels:
    app: concordia-predictions-frontend
  # This ConfigMap provides a templated index.html that injects the backend URL at runtime.
  # The placeholder ${BACKEND_API_URL} will be replaced by envsubst when the container starts.
  # The rest of the file is copied from the static index.html generated by the build.

data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ConcordiaPredictions</title>
        <script>
          window.__CONFIG__ = {
            BACKEND_API_URL: "${BACKEND_API_URL}"
          };
        </script>
        <script type="module" crossorigin src="/assets/index-DYQN4zm2.js"></script>
        <link rel="stylesheet" crossorigin href="/assets/index-Csc5unoC.css" />
      </head>
      <body>
        <div id="root"></div>
      </body>
    </html>


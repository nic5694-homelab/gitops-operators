apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# ─────────────────────────────────────────────────────────────────────────────
# Argo CD Image Updater will patch these images automatically.
# When a new :latest is pushed to Docker Hub, it rewrites the image lines below
# with the new digest or SHA tag, then commits back to this file.
# ─────────────────────────────────────────────────────────────────────────────
images:
  - name: nic5694/concordia-predictions-backend
    newTag: latest
  - name: nic5694/concordia-predictions-frontend
    newTag: latest

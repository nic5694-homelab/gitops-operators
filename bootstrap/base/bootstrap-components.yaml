apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nic5694-homelab/gitops-operators.git
    targetRevision: HEAD
    path: components
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
